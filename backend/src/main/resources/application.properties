# ===== Static Frontend =====================================================
# Frontend files are bundled inside the JAR under src/main/resources/static/.
# Spring Boot serves them automatically from classpath:/static/.
# This works both locally (mvn spring-boot:run) and in production (Render/Docker).
spring.web.resources.static-locations=classpath:/static/

# Enable caching headers for static assets in production
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

# ===== Logging =====

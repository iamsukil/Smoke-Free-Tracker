# ===== Server =====
server.port=8080

# ===== MySQL DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/smoke_free_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sukil@15102003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=SmokeFreeTrackerSuperSecretKeyForJWT2024ApplicationSecurityKey
jwt.expiration=86400000

# ===== Quartz =====
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true

# ===== Static Frontend =====================================================
# The frontend/ folder lives next to backend/ in the project root.
# When running `mvn spring-boot:run` from the backend/ directory,
# file:../frontend/ resolves to  Smoke_Free_Tracker/frontend/.
# classpath:/static/ is kept as an empty fallback.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# ===== Logging =====
logging.level.com.smokefree=DEBUG
logging.level.org.springframework.security=INFO

spring.main.allow-circular-references=false

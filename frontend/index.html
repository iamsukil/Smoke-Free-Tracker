<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Smoke-Free Tracker — Start your journey to a healthier, smoke-free life today."/>
  <title>Smoke-Free Tracker | Login &amp; Register</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <meta name="theme-color" content="#7C3AED"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SmokeFree"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container animate-fade">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">🚭</div>
        <h1>Smoke-Free Tracker</h1>
        <p>Your journey to a healthier life starts here</p>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">

        <!-- Tabs -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" role="tab">Sign In</button>
          <button class="auth-tab" id="tab-register" onclick="switchTab('register')" role="tab">Create Account</button>
        </div>

        <!-- Alert Area -->
        <div id="alert-area"></div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="login-form" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input class="form-input" type="email" id="login-email" name="email"
                   placeholder="you@example.com" autocomplete="email" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" type="password" id="login-password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
            <span id="login-spinner" class="hidden">⏳</span>
            Sign In
          </button>
        </form>

        <!-- ===== REGISTER FORM ===== -->
        <form id="register-form" class="hidden" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input class="form-input" type="text" id="reg-name" name="name"
                   placeholder="John Doe" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input class="form-input" type="email" id="reg-email" name="email"
                   placeholder="you@example.com" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-input" type="password" id="reg-password" name="password"
                   placeholder="Min 6 characters" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
            <span id="register-spinner" class="hidden">⏳</span>
            Create Account
          </button>
          <p class="text-center mt-2 text-muted" style="font-size:12px;">
            You'll set up your quit details after signing in
          </p>
        </form>

      </div>

      <p class="text-center mt-2 text-muted" style="font-size:12px;">
        By signing in you agree to our <a href="#" style="color:var(--accent-primary);">Terms of Service</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
